<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Торговая Лавка — Dark World</title>
  <style>
    /* ============================================================================
       ===== 🎨 БАЗОВАЯ НАСТРОЙКА, ПАЛИТРА И ИНТЕРФЕЙС СТРАНИЦЫ МАГАЗИНА =====
       ============================================================================ */
    :root {
      --bg: #1a1a2e;
      --text: #ffffff;
      --hint: #9aa0b5;
      --btn: #6c5ce7;
      --btn-text: #ffffff;
      --card: rgba(255, 255, 255, 0.06);
      --danger: #e74c3c;
      --success: #2ecc71;
    }

    * { 
      box-sizing: border-box; 
      -webkit-tap-highlight-color: transparent; 
    }

    body {
      margin: 0;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
    }

    .shop-container { 
      max-width: 480px; 
      margin: 0 auto; 
      display: flex;
      flex-direction: column;
      min-height: 92vh;
    }

    #shop-title { 
      text-align: center; 
      font-size: 24px; 
      margin: 4px 0 8px 0; 
      color: #f1c40f;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
    }

    /* Кошелек и уровень игрока в шапке лавки */
    .shop-wallet-card {
      background: var(--card);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 16px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      color: #f1c40f;
    }

    /* ============================================================================
       ===== 🗂️ ДВУХУРОВНЕВАЯ СИСТЕМА НАВИГАЦИИ (АМУНИЦИЯ, РАСХОДНИКИ, ПРОДАЖА) =====
       ============================================================================ */
    
    /* Уровень 1: Три главные верхние вкладки */
    .shop-main-navigation {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
      background: rgba(0, 0, 0, 0.2);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .main-nav-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--hint);
      padding: 12px 4px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .main-nav-btn.active {
      background: var(--btn);
      color: var(--btn-text);
      box-shadow: 0 4px 12px rgba(108, 92, 231, 0.3);
    }

    /* Уровень 2: Подменю выбора комплектов внутри Амуниции */
    .shop-sub-navigation {
      display: flex;
      gap: 4px;
      margin: 0 auto 16px auto;
      max-width: 340px;
      width: 100%;
    }

    .sub-nav-btn {
      flex: 1;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      color: #8a94a6;
      padding: 8px 2px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .sub-nav-btn.active {
      background: #34495e;
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.15);
    }

    /* ============================================================================
       ===== 📦 СПИСОК ТОВАРОВ, КАРТОЧКИ И ТАКТИЧЕСКИЕ КНОПКИ ДЕЙСТВИЙ =====
       ============================================================================ */
    .shop-scroll-viewport {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 20px;
    }

    .lvl-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .lvl-header {
      font-size: 13px;
      font-weight: bold;
      color: var(--hint);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding-left: 4px;
      margin-bottom: 2px;
    }

    .item-row {
      background: var(--card);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .item-icon {
      font-size: 26px;
      width: 44px;
      height: 44px;
      background: rgba(0, 0, 0, 0.15);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .item-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .item-name {
      font-size: 15px;
      font-weight: bold;
    }

    .item-desc {
      font-size: 12px;
      color: var(--hint);
      line-height: 1.3;
    }

    /* Кнопка покупки предмета */
    .btn-buy {
      background: var(--success);
      color: #ffffff;
      border: none;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.1s;
    }
    .btn-buy:disabled {
      background: rgba(255, 255, 255, 0.04);
      color: #656d78;
      cursor: not-allowed;
    }

    /* Кнопка мгновенной продажи предмета */
    .btn-sell-action {
      background: #e67e22;
      color: #ffffff;
      border: none;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.1s;
    }
    .btn-sell-action:active { transform: scale(0.95); opacity: 0.9; }

    .shop-empty-msg {
      text-align: center;
      color: var(--hint);
      font-size: 14px;
      padding: 48px 16px;
      line-height: 1.6;
    }

    /* Кнопка полного выхода обратно на площадь */
    .shop-exit-btn {
      width: 100%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text);
      padding: 14px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      margin-top: auto;
      transition: all 0.15s;
    }
    .shop-exit-btn:active { transform: scale(0.98); background: var(--danger); border-color: var(--danger); }
  </style>
  
<script src="https://cdn.socket.io/4.8.3/socket.io.min.js"></script>
  <script src="shop_items_config.js"></script>
</head>
<body>

  <div class="shop-container">
    <div id="shop-title">🏪 Торговая Лавка</div>
    
    <!-- Плашка состояния кошелька игрока -->
    <div id="shop-user-gold" class="shop-wallet-card">💰 Загрузка кошелька...</div>

    <!-- УРОВЕНЬ 1: ТРИ СТРУКТУРНЫЕ ВЕРХНИЕ ВКЛАДКИ -->
    <div class="shop-main-navigation">
      <button id="main-nav-ammo" class="main-nav-btn active" onclick="window.switchShopMode('ammo')">🛡️ Амуниция</button>
      <button id="main-nav-consumables" class="main-nav-btn" onclick="window.switchShopMode('consumables')">🧪 Расходники</button>
      <button id="main-nav-sell" class="main-nav-btn" onclick="window.switchShopMode('sell')">💸 Продажа</button>
    </div>

    <!-- УРОВЕНЬ 2: ДИНАМИЧЕСКИЕ ПОДВКЛАДКИ КЛАССОВ СНАРЯЖЕНИЯ -->
    <div id="shop-sub-categories" class="shop-sub-navigation">
      <button id="sub-tab-dodger" class="sub-nav-btn active" onclick="window.setShopClass('dodger')">🏹 Плут</button>
      <button id="sub-tab-critter" class="sub-nav-btn" onclick="window.setShopClass('critter')">⚡ Варвар</button>
      <button id="sub-tab-tank" class="sub-nav-btn" onclick="window.setShopClass('tank')">🪵 Танк</button>
    </div>

    <!-- Динамическая скролл-зона вывода товаров -->
    <div id="shop-scroll-area" class="shop-scroll-viewport"></div>

    <!-- Кнопка безопасного возвращения на площадь города -->
    <button class="shop-exit-btn" onclick="window.exitShop()">🏃 Покинуть лавку</button>
  </div>

  <!-- Подключаем логику управления магазином -->
  <script src="shop_client.js"></script>
</body>
</html>
