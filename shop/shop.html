<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Торговая Лавка — Dark World</title>

  <!-- Стили -->
  <link rel="stylesheet" href="../style.css?v=78">
  <link rel="stylesheet" href="../shared/ui.css?v=1">

  <style>
    /* Специфичные стили магазина (остаются локально) */
    .shop-container {
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      min-height: 92vh;
    }

    #shop-title {
      text-align: center;
      font-size: 24px;
      margin: 4px 0 8px 0;
      color: #f1c40f;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
    }

    .shop-wallet-card {
      background: var(--card);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 16px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      color: #f1c40f;
    }

    .shop-main-navigation {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
      background: rgba(0, 0, 0, 0.2);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .main-nav-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--hint);
      padding: 12px 4px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .main-nav-btn.active {
      background: var(--btn);
      color: var(--btn-text);
      box-shadow: 0 4px 12px rgba(108, 92, 231, 0.3);
    }

    .shop-sub-navigation {
      display: flex;
      gap: 4px;
      margin: 0 auto 16px auto;
      max-width: 340px;
      width: 100%;
    }

    .sub-nav-btn {
      flex: 1;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      color: #8a94a6;
      padding: 8px 2px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .sub-nav-btn.active {
      background: #34495e;
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.15);
    }

    .shop-scroll-viewport {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 20px;
    }

    .lvl-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .lvl-header {
      font-size: 13px;
      font-weight: bold;
      color: var(--hint);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding-left: 4px;
      margin-bottom: 2px;
    }

    .item-row {
      background: var(--card);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .item-icon {
      font-size: 26px;
      width: 44px;
      height: 44px;
      background: rgba(0, 0, 0, 0.15);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .item-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .item-name {
      font-size: 15px;
      font-weight: bold;
    }

    .item-desc {
      font-size: 12px;
      color: var(--hint);
      line-height: 1.3;
    }

    .btn-buy {
      background: var(--success);
      color: #ffffff;
      border: none;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.1s;
    }
    .btn-buy:disabled {
      background: rgba(255, 255, 255, 0.04);
      color: #656d78;
      cursor: not-allowed;
    }

    .btn-sell-action {
      background: #e67e22;
      color: #ffffff;
      border: none;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-sell-action:active { transform: scale(0.95); opacity: 0.9; }

    .shop-empty-msg {
      text-align: center;
      color: var(--hint);
      font-size: 14px;
      padding: 48px 16px;
      line-height: 1.6;
    }
  </style>

  <script src="https://cdn.socket.io/4.8.3/socket.io.min.js"></script>
  <script src="../config.js?v=78"></script>
  <script src="../shared/ui.js?v=2" defer></script>
  <script src="shop_items_config.js"></script>
  <script src="shop_client.js?v=7" defer></script>
</head>
<body>

  <div class="shop-container">
    <div style="display: flex; align-items: center; justify-content: space-between; width: 100%; margin-bottom: 4px;">
      <div id="shop-title" style="margin: 0; padding: 0;">🏪 Торговая Лавка</div>
      <div id="shop-hero-hp" style="font-size: 12px; font-weight: bold; color: #e74c3c; margin-top: 4px;">❤️ 0 / 0</div>

      <button onclick="window.exitShop()" style="background: rgba(255, 255, 255, 0.08); border: none; color: #ffffff; font-size: 16px; width: 34px; height: 34px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; margin-top: 8px;" title="Покинуть лавку">✕</button>
    </div>

    <div id="shop-user-gold" class="shop-wallet-card" style="display: flex; justify-content: space-between; align-items: center;">
      <span id="wallet-gold-value">💰 Загрузка...</span>
      <span id="wallet-status-log" style="color: #2ecc71; font-size: 12px; font-weight: bold; background: rgba(0,0,0,0.2); padding: 2px 8px; border-radius: 6px;">🟢 Готов к торговле</span>
    </div>

    <div class="shop-main-navigation">
      <button id="main-nav-ammo" class="main-nav-btn active" onclick="window.switchShopMode('ammo')">🛡️ Амуниция</button>
      <button id="main-nav-consumables" class="main-nav-btn" onclick="window.switchShopMode('consumables')">🧪 Расходники</button>
      <button id="main-nav-sell" class="main-nav-btn" onclick="window.switchShopMode('sell')">💸 Продажа</button>
    </div>

    <div id="shop-sub-categories" class="shop-sub-navigation">
      <button id="sub-tab-dodger" class="sub-nav-btn active" onclick="window.setShopClass('dodger')">🏹 Плут</button>
      <button id="sub-tab-critter" class="sub-nav-btn" onclick="window.setShopClass('critter')">⚡ Варвар</button>
      <button id="sub-tab-tank" class="sub-nav-btn" onclick="window.setShopClass('tank')">🪵 Танк</button>
    </div>

    <div id="shop-scroll-area" class="shop-scroll-viewport"></div>
  </div>

  <!-- Поповер и модалки создаёт UI.init() из shared/ui.js -->

  <script src="../global_battle_watch.js?v=5"></script>
</body>
</html>
