<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Битва Чести — Dark World</title>

  <script src="https://cdn.socket.io/4.8.3/socket.io.min.js"></script>

  <script>
    window.GAME_ITEMS_DATABASE = window.GAME_ITEMS_DATABASE || {};
  </script>

  <script src="../config.js?v=78"></script>
  <script src="../shop/shop_items_config.js?v=130"></script>

  <!-- Клиентские модули боя (порядок важен!) -->
  <script src="client/battle_state.js?v=9" defer></script>
  <script src="client/battle_toasts.js?v=8" defer></script>
  <script src="client/battle_timer.js?v=8" defer></script>
  <script src="client/battle_renderer.js?v=9" defer></script>
  <script src="client/battle_stats.js?v=9" defer></script>
  <script src="client/battle_ui.js?v=10" defer></script>
  <script src="client/battle_socket.js?v=14" defer></script>
  <script src="client/battle_client.js?v=8" defer></script>

  <link rel="stylesheet" href="../style.css?v=80">
  <link rel="stylesheet" href="../shared/ui.css?v=8">

  <style>
    :root {
      --bg: #0d0e15;
      --text: #ffffff;
      --hint: #636e72;
      --btn: #5f27cd;
      --danger: #ff4d4d;
      --success: #2ecc71;
      --card: rgba(255, 255, 255, 0.03);
      --border: rgba(255, 255, 255, 0.08);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
    }

    body {
      padding: 6px;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text);
      display: flex; flex-direction: column;
      height: 100vh; overflow: hidden;
      align-items: center;
    }

    #battle-screen {
      max-width: 480px; width: 100%;
      display: flex; flex-direction: column; height: 100%; gap: 6px;
      overflow-x: hidden;
    }

    .battle-header {
      text-align: center; font-size: 14px; font-weight: bold; color: #f1c40f;
      padding: 3px 0; border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    /* ============================================================
       ДУЭЛЬ-ЗОНА — три блока: слева, центр, справа
       ============================================================ */
    .duel-zone {
      display: flex !important;
      flex-direction: row !important;
      justify-content: space-between !important;
      align-items: flex-start !important;
      gap: 4px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 12px;
      padding: 5px;
      border: 1px solid var(--border);
      width: 100%;
      flex-shrink: 0;
    }

    .fighter-side-wrapper {
      display: flex; flex-direction: column;
      align-items: center;
      width: 90px;                 /* 🔥 было 110px — уменьшили */
      flex-shrink: 0;
      min-width: 0;
    }

    .big-fighter-card {
      width: 90px;                 /* 🔥 было 110px */
      height: 125px;               /* 🔥 было 145px */
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 5px 3px;
      text-align: center;
      display: flex; flex-direction: column;
      align-items: center; justify-content: flex-start;
      position: relative; overflow: hidden;
      background: #13141f;
      box-shadow: 0 3px 10px rgba(0,0,0,0.4);
      flex-shrink: 0;
    }

    .card-background-art {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: 1; opacity: 0.75;
      filter: contrast(1.05) saturate(1.1);
      pointer-events: none;
    }

    .card-gradient-overlay {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      background: linear-gradient(to bottom,
        rgba(13, 14, 21, 0.75) 0%,
        rgba(13, 14, 21, 0.0) 35%,
        rgba(13, 14, 21, 0.0) 65%,
        rgba(13, 14, 21, 0.85) 100%);
      z-index: 2; pointer-events: none;
    }

    .big-lvl, .big-name, .hp-wrapper { position: relative; z-index: 3; }

    .big-lvl {
      font-size: 10px; color: #f1c40f; font-weight: bold;
      height: 12px; line-height: 12px;
      margin-bottom: 3px; text-shadow: 0 1px 4px #000;
      width: 100%; text-align: center;
    }

    .big-name {
      height: 24px;
      font-size: 9px;
      font-weight: bold;
      line-height: 1.15;
      width: 100%;
      white-space: normal;
      word-wrap: break-word;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;                   /* 🔥 стандартная версия */
      -webkit-box-orient: vertical;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #ffffff;
      margin-top: auto; margin-bottom: 2px;
      text-shadow: 0 1px 4px #000;
    }

    .hp-wrapper { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .hp-bar {
      width: 100%; height: 5px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 3px; overflow: hidden;
      border: 1px solid rgba(0,0,0,0.2);
    }
    .hp-fill { height: 100%; background: linear-gradient(90deg, #2ecc71, #26de81); width: 100%; transition: width 0.3s ease; }
    .enemy-hp .hp-fill { background: linear-gradient(90deg, #ff4757, #ff6b6b); }

    .hp-text {
      font-size: 11px;             /* 🔥 было 13px */
      color: #ffffff;
      font-family: monospace;
      font-weight: bold;
      text-shadow: 0 1px 4px rgba(0,0,0,0.9);
    }

    .quick-slots-row { display: flex; gap: 4px; width: 100%; margin-top: 4px; }
    .quick-action-btn {
      flex: 1; height: 30px;       /* 🔥 было 32pаx */
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 6px; color: #ffffff;
      font-size: 13px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s ease;
    }
    .quick-action-btn:disabled { opacity: 0.15; cursor: not-allowed; box-shadow: none; }

    /* ============================================================
       ЦЕНТРАЛЬНЫЙ ПУЛЬТ
       ============================================================ */
      .tactical-center-controls {
        flex: 1 1 auto;
        min-width: 100px;        /* 🔥 минимум вместо 0 */
        display: flex; flex-direction: column; gap: 4px;
        background: rgba(0, 0, 0, 0.4);
        padding: 4px; border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.05);
        justify-content: space-between;
        /* overflow: hidden;   ← убрать */
      }

    .columns-wrapper { display: flex; gap: 3px; width: 100%; min-width: 0; }
    .zone-column-box { flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .mini-title {
      font-size: 8px; font-weight: bold;
      text-align: center; margin-bottom: 1px;
      letter-spacing: 0.5px; text-transform: uppercase;
    }

    .compact-zone-btn {
      width: 100%;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #b2bec3;
      padding: 5px 0;              /* 🔥 было 7px */
      font-size: 9px;              /* 🔥 было 10px */
      font-weight: 600;
      border-radius: 5px;
      cursor: pointer; text-align: center;
      transition: all 0.15s ease;
      text-transform: uppercase;
    }
    .compact-zone-btn.attack-selected {
      background: linear-gradient(135deg, #ff9f43, #ee5253) !important;
      border-color: #ff6b6b; color: #fff !important; box-shadow: 0 0 8px rgba(238, 82, 83, 0.4);
    }
    .compact-zone-btn.defend-selected {
      background: linear-gradient(135deg, #0abde3, #10ac84) !important;
      border-color: #00d2d3; color: #fff !important; box-shadow: 0 0 8px rgba(10, 189, 227, 0.4);
    }

    #strike-action-btn {
      width: 100%;
      background: linear-gradient(135deg, #70a1ff, #1e90ff);
      color: white; border: none;
      padding: 7px;                /* 🔥 было 9px */
      font-size: 11px;             /* 🔥 было 12px */
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 12px rgba(30, 144, 255, 0.2);
    }
    #strike-action-btn:disabled {
      background: #2c3e50 !important;
      color: #7f8c8d !important;
      opacity: 0.4; cursor: not-allowed;
      box-shadow: none;
    }

    #random-strike-btn {
      width: 100%;
      background: #e67e22;
      color: #fff;
      padding: 5px 6px;            /* 🔥 было 6px 8px */
      font-size: 10px;             /* 🔥 было 11px */
      font-weight: bold;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      box-shadow: 0 3px 8px rgba(230, 126, 34, 0.25);
      margin-top: 2px;
    }
    #random-strike-btn:disabled { opacity: 0.4; pointer-events: none; }

    /* ============================================================
       МАССОВКА
       ============================================================ */
    .reserve-zone {
      display: flex; justify-content: space-between; gap: 6px;
      width: 100%; margin-top: 2px;
      flex-shrink: 0;
    }
    .reserve-column {
      flex: 1; display: flex; flex-direction: column; gap: 3px;
      background: rgba(0, 0, 0, 0.2); padding: 4px;
      border-radius: 8px;
      max-height: 80px;             /* 🔥 было 90px */
      overflow-y: auto;
      border: 1px solid var(--border);
      min-width: 0;
    }
    .mini-fighter-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 3px 5px;
      display: flex; align-items: center; justify-content: space-between;
      gap: 4px; cursor: pointer;
    }
    .mini-fighter-card.active-target { border: 1px solid #ff4757; background: rgba(255, 71, 87, 0.08); }
    .mini-fighter-card.dead { opacity: 0.2; pointer-events: none; }
    .mini-fighter-info {
      font-size: 9px;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 70px;
      color: #c8d6e5;
      min-width: 0;
    }

    /* ============================================================
       ЛОГИ
       ============================================================ */
    .battle-bottom {
      width: 100%; flex: 1;
      display: flex; flex-direction: column; gap: 4px;
      min-height: 80px; margin-top: 2px;
      overflow: hidden;
    }
    .battle-log {
      flex: 1;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px;
      font-size: 11px;
      line-height: 1.3;
      font-family: monospace;
      overflow-y: auto;
      overflow-x: hidden;
      word-break: break-word;
    }
    .log-round-break { color: #f1c40f; margin: 4px 0; border-top: 1px dashed var(--border); padding-top: 4px; font-weight: bold; text-align: center; }
    .log-damage { color: #ff6b6b; }
    .log-system { color: #f1c40f; font-weight: bold; }
    .log-miss { color: #84817a; }

    /* ============================================================
       ЗАГРУЗКА
       ============================================================ */
    #battle-loading-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: var(--bg);
      z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid rgba(255,255,255,0.1);
      border-left-color: #1e90ff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ============================================================
       🔥 МОБИЛЬНЫЙ АДАПТИВ — для узких экранов
       ============================================================ */
    @media (max-width: 400px) {
      .fighter-side-wrapper { width: 80px; }
      .big-fighter-card { width: 80px; height: 115px; }
      .big-name { font-size: 8px; height: 22px; }
      .big-lvl { font-size: 9px; height: 11px; }
      .hp-text { font-size: 10px; }
      .compact-zone-btn { padding: 4px 0; font-size: 8px; }
      #strike-action-btn { padding: 6px; font-size: 10px; }
      #random-strike-btn { padding: 4px 5px; font-size: 9px; }
      .battle-log { font-size: 10px; }
    }

    @media (max-width: 360px) {
      .fighter-side-wrapper { width: 70px; }
      .big-fighter-card { width: 70px; height: 105px; }
      .big-name { font-size: 7px; height: 20px; }
      .big-lvl { font-size: 8px; height: 10px; }
      .hp-text { font-size: 9px; }
      .compact-zone-btn { padding: 3px 0; font-size: 8px; }
      #strike-action-btn { padding: 5px; font-size: 9px; }
      #random-strike-btn { padding: 3px 4px; font-size: 8px; }
      .mini-fighter-info { font-size: 8px; max-width: 55px; }
    }

    @media (max-height: 700px) {
      .big-fighter-card { height: 115px; }
      .reserve-column { max-height: 60px; }
    }

    @media (max-height: 600px) {
      .big-fighter-card { height: 105px; }
      .reserve-column { max-height: 50px; }
      .battle-log { font-size: 10px; }
    }
  </style>
</head>
<body>

  <div id="battle-loading-overlay">
    <div class="spinner"></div>
    <div style="font-weight: bold; color: #7f8c8d; font-size: 13px; font-family: sans-serif;">Синхронизация графики дуэли...</div>
  </div>

  <div id="battle-screen">
    <div id="battle-round-indicator" class="battle-header">Подключение к арене...</div>

    <div class="duel-zone">
      <!-- ЛЕВАЯ СТОРОНА: Герой -->
      <div class="fighter-side-wrapper">
        <div id="main-hero-card" class="big-fighter-card">
          <img id="hero-card-bg-img" class="card-background-art" src="../assets/avatars/hero4.jpg" alt="Hero BG">
          <div class="card-gradient-overlay"></div>
          <div class="big-name" id="hero-name-text">Загрузка...</div>
          <div class="big-lvl" id="hero-lvl-text">Lv. --</div>
          <div class="hp-wrapper">
            <div class="hp-bar"><div id="hero-hp-fill" class="hp-fill"></div></div>
            <div class="hp-text" id="hero-hp-text">0 / 0</div>
          </div>
        </div>
        <div class="quick-slots-row">
          <button id="quick-potion-btn" class="quick-action-btn" title="Выпить зелье" disabled>🧪</button>
          <button id="quick-scroll-btn" class="quick-action-btn" title="Свиток" disabled>📜</button>
        </div>
      </div>

      <!-- ЦЕНТРАЛЬНЫЙ ПУЛЬТ ->
      <div class="tactical-center-controls">
        <div class="columns-wrapper">
          <div class="zone-column-box">
            <div class="mini-title" style="color: #ff9f43;">УДАР</div>
            <button class="compact-zone-btn btn-atk" data-zone="head">Голова</button>
            <button class="compact-zone-btn btn-atk" data-zone="breast">Грудь</button>
            <button class="compact-zone-btn btn-atk" data-zone="torso">Живот</button>
            <button class="compact-zone-btn btn-atk" data-zone="belt">Пояс</button>
            <button class="compact-zone-btn btn-atk" data-zone="legs">Ноги</button>
          </div>
          <div class="zone-column-box">
            <div class="mini-title" style="color: #0abde3;">БЛОК</div>
            <button class="compact-zone-btn btn-def" data-zone="head">Голова</button>
            <button class="compact-zone-btn btn-def" data-zone="breast">Грудь</button>
            <button class="compact-zone-btn btn-def" data-zone="torso">Живот</button>
            <button class="compact-zone-btn btn-def" data-zone="belt">Пояс</button>
            <button class="compact-zone-btn btn-def" data-zone="legs">Ноги</button>
          </div>
        </div>
        <button id="strike-action-btn" disabled>АТАКОВАТЬ</button>
        <button id="random-strike-btn">🎲 СЛУЧАЙНЫЙ ХОД</button>
      </div>

      <!-- ПРАВАЯ СТОРОНА: Враг -->
      <div class="fighter-side-wrapper">
        <div id="main-target-card" class="big-fighter-card">
          <img id="target-card-bg-img" class="card-background-art" src="../assets/monsters/monster1.jpg" alt="Monster BG">
          <div class="card-gradient-overlay"></div>
          <div class="big-name" id="target-name-text">Нет цели</div>
          <div class="big-lvl" id="target-lvl-text">Lv. --</div>
          <div class="hp-wrapper enemy-hp">
            <div class="hp-bar"><div id="target-hp-fill" class="hp-fill"></div></div>
            <div class="hp-text" id="target-hp-text">0 / 0</div>
          </div>
        </div>
        <div class="quick-slots-row">
          <button class="quick-action-btn" disabled style="opacity: 0.05;">🛡️</button>
          <button class="quick-action-btn" disabled style="opacity: 0.05;">⚔️</button>
        </div>
      </div>
    </div>

    <!-- МАССОВКА -->
    <div class="reserve-zone">
      <div style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0;">
        <div class="mini-title" style="text-align: left; padding-left: 4px; color: #2ecc71;">👥 Отряд:</div>
        <div id="allies-reserve-list" class="reserve-column"></div>
      </div>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0;">
        <div class="mini-title" style="text-align: left; padding-left: 4px; color: #ff4757;">🎯 Враги:</div>
        <div id="enemies-reserve-list" class="reserve-column"></div>
      </div>
    </div>

    <!-- ЛОГИ -->
    <div class="battle-bottom">
      <div id="battle-log-viewport" class="battle-log">
        <div class="log-system">Синхронизация логов с сервером...</div>
      </div>
    </div>
  </div>

  <!-- Поповеры статов -->
  <div id="player-stats-popover" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 6px;">
      <h3 style="margin: 0; color: #6c5ce7; font-size: 16px;">📊 Характеристики</h3>
      <button onclick="document.getElementById('player-stats-popover').style.display='none'" style="background: rgba(255,255,255,0.1); border: none; color: #fff; border-radius: 50%; width: 24px; height: 24px; cursor: pointer; font-weight: bold; font-size: 12px;">✕</button>
    </div>
    <div id="player-popover-body" class="modal-body-stats"></div>
  </div>

  <div id="monster-stats-popover" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 6px;">
      <h3 style="margin: 0; color: #e74c3c; font-size: 16px;">👹 Параметры цели</h3>
      <button onclick="document.getElementById('monster-stats-popover').style.display='none'" style="background: rgba(255,255,255,0.1); border: none; color: #fff; border-radius: 50%; width: 24px; height: 24px; cursor: pointer; font-weight: bold; font-size: 12px;">✕</button>
    </div>
    <div id="monster-popover-body" class="modal-body-stats"></div>
  </div>

</body>
</html>
