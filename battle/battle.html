<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Битва Чести — Dark World</title>
      <!-- 1. Библиотека Supabase (Загружается первой) -->
   <script src="https://cdn.socket.io/4.8.3/socket.io.min.js"></script>
    <script src="../config.js" defer></script>
    <script src="client_battle.js" defer></script>
  
  <style>:root {
      --bg: #1a1a2e;
      --text: #ffffff;
      --hint: #9aa0b5;
      --btn: #6c5ce7;
      --danger: #e74c3c;
      --success: #2ecc71;
      --card: rgba(255, 255, 255, 0.05);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 8px; /* Уменьшили отступы от краев экрана */
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    #battle-screen {
      max-width: 480px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      height: 100%;
      gap: 6px; /* Компактные зазоры между блоками */
    }

    .battle-header {
      text-align: center;
      font-size: 15px;
      font-weight: bold;
      color: #f1c40f;
      padding: 2px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .team-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr); /* Форсируем 3 колонки для массовки */
      gap: 6px;
      padding: 2px;
    }

    .fighter-card {
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 4px; /* Меньше паддингов внутри плашки */
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 2px;
      position: relative;
      cursor: pointer;
    }

    .fighter-card.target-selected {
      border: 1px solid var(--danger);
      background: rgba(231, 76, 60, 0.12);
      box-shadow: 0 0 6px rgba(231, 76, 60, 0.3);
    }

    .fighter-card.dead {
      opacity: 0.25;
      background: rgba(0, 0, 0, 0.4) !important;
      pointer-events: none;
    }

    .fighter-info {
      font-size: 11px; /* Сделали шрифт компактнее, чтобы ник не переносился */
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .fighter-lvl {
      font-size: 9px;
      color: #f1c40f;
    }

    .fighter-hp-bar {
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      overflow: hidden;
    }

    .fighter-hp-fill {
      height: 100%;
      background: var(--success);
      width: 100%;
      transition: width 0.3s ease;
    }

    .team-enemies .fighter-hp-fill { background: #e74c3c; }
    .fighter-hp-text { font-size: 9px; color: var(--hint); font-family: monospace; }

    /* Резиновая центральная зона логов */
    .battle-center {
      flex: 1; /* Лог теперь занимает ВСЁ свободное пространство, подстраиваясь под высоту телефона */
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-height: 80px; 
    }

    .battle-log {
      flex: 1;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 8px;
      font-size: 12px;
      line-height: 1.3;
      font-family: monospace;
      overflow-y: auto;
    }

    .tactical-panel {
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .tactical-title {
      font-size: 11px;
      color: var(--hint);
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      text-align: center;
      margin: 2px 0;
    }

    .zone-row {
      display: flex;
      gap: 4px;
    }

    .zone-btn {
      flex: 1;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text);
      padding: 6px 2px;
      font-size: 11px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }

    .zone-btn.attack-selected { background: #e67e22 !important; border-color: #d35400; }
    .zone-btn.defend-selected { background: #3498db !important; border-color: #2980b9; }

    #strike-action-btn {
      width: 100%;
      background: var(--btn);
      color: white;
      border: none;
      padding: 10px; /* Уменьшили высоту кнопки, чтобы она точно влезла */
      font-size: 14px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 4px;
    }
    #strike-action-btn:disabled { background: #57606f !important; opacity: 0.5; }

    #battle-loading-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: var(--bg); z-index: 9999; display: flex;
      flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    }
    .spinner { width: 32px; height: 32px; border: 3px solid rgba(255,255,255,0.1); border-left-color: var(--btn); border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } } </style>
</head>
<body>

  <!-- Шторка загрузки -->
  <div id="battle-loading-overlay">
    <div class="spinner"></div>
    <div style="font-weight: bold; color: var(--hint);">Подготовка арены боя...</div>
  </div>

  <div id="battle-screen">
    <!-- Заголовок раундов -->
    <div id="battle-round-indicator" class="battle-header">Инициализация боя...</div>

    <!-- ВЕРХНЯЯ СЕТКА: Враги (Team B) -->
    <div class="tactical-title">🎯 Противники (Нажмите для выбора цели)</div>
    <div id="enemies-grid" class="team-grid team-enemies">
      <!-- Заполняется динамически прямоугольниками монстров/игроков через JS -->
    </div>

    <!-- ЦЕНТР: Логи поединка и Зелье -->
    <div class="battle-center">
      <button id="battle-potion-btn">🧪 Выпить зелье здоровья</button>
      <div id="battle-log-viewport" class="battle-log">
        <div class="log-system">Ожидание подключения к боевому серверу...</div>
      </div>
    </div>

    <!-- НИЖНЯЯ СЕТКА: Ваш отряд (Team A) -->
    <div class="tactical-title">🛡️ Ваш отряд</div>
    <div id="allies-grid" class="team-grid team-allies">
      <!-- Заполняется динамически прямоугольниками вашей команды через JS -->
    </div>

    <!-- ТАКТИЧЕСКАЯ ПАНЕЛЬ: Выбор ударов и блоков -->
    <div class="tactical-panel">
      <!-- Ряды Атаки -->
      <div class="tactical-title">⚔️ Зона вашей атаки (Выберите 1)</div>
      <div class="zone-row">
        <button class="zone-btn btn-atk" data-zone="head">Голова</button>
        <button class="zone-btn btn-atk" data-zone="breast">Грудь</button>
        <button class="zone-btn btn-atk" data-zone="torso">Торс</button>
        <button class="zone-btn btn-atk" data-zone="belt">Пояс</button>
        <button class="zone-btn btn-atk" data-zone="legs">Ноги</button>
      </div>

      <!-- Ряды Защиты -->
      <div class="tactical-title">🛡️ Зоны вашей защиты (Выберите 2)</div>
      <div class="zone-row">
        <button class="zone-btn btn-def" data-zone="head">Голова</button>
        <button class="zone-btn btn-def" data-zone="breast">Грудь</button>
        <button class="zone-btn btn-def" data-zone="torso">Торс</button>
        <button class="zone-btn btn-def" data-zone="belt">Пояс</button>
        <button class="zone-btn btn-def" data-zone="legs">Ноги</button>
      </div>

      <!-- Кнопка действия -->
