<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Битва Чести — Dark World</title>
  <!-- Клиент Socket.io (версия 4.8.3, как в городе) -->
  <script src="https://cdn.socket.io/4.8.3/socket.io.min.js"></script>
  <script src="../config.js" defer></script>
  <script src="client_battle.js" defer></script>
  
  <style>
    :root {
      --bg: #1a1a2e;
      --text: #ffffff;
      --hint: #9aa0b5;
      --btn: #6c5ce7;
      --danger: #e74c3c;
      --success: #2ecc71;
      --card: rgba(255, 255, 255, 0.05);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }

    body {
      margin: 0; padding: 8px;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text);
      display: flex; flex-direction: column;
      height: 100vh; overflow: hidden;
    }

    #battle-screen {
      max-width: 480px; margin: 0 auto; width: 100%;
      display: flex; flex-direction: column; height: 100%; gap: 6px;
    }

    .battle-header {
      text-align: center; font-size: 15px; font-weight: bold; color: #f1c40f;
      padding: 2px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* ============================================================================
       ===== ⚔️ ГЛАВНАЯ ВЕРХНЯЯ ЗОНА: ДУЭЛЬ 1Х1 =====
       ============================================================================ */
    .duel-zone {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      background: rgba(0, 0, 0, 0.15);
      border-radius: 12px;
      padding: 6px;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    /* Большие карточки дуэлянтов */
    .big-fighter-card {
      flex: 1;
      max-width: 135px;
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 8px 4px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    
    .big-avatar {
      font-size: 42px;
      line-height: 1;
      margin: 4px 0;
    }

    .big-name { font-size: 13px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
    .big-lvl { font-size: 10px; color: #f1c40f; }

    /* Центральный пульт управления тактикой */
    .tactical-center-controls {
      flex: 1.2;
      display: flex;
      flex-direction: column;
      gap: 4px;
      background: rgba(255, 255, 255, 0.02);
      padding: 4px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .mini-title { font-size: 9px; color: var(--hint); text-transform: uppercase; font-weight: bold; text-align: center; margin: 1px 0; }
    .compact-zone-row { display: flex; gap: 2px; justify-content: center; width: 100%; }
    
    .compact-zone-btn {
      flex: 1; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text); padding: 4px 1px; font-size: 9px; font-weight: bold; border-radius: 4px; cursor: pointer;
    }
    .compact-zone-btn.attack-selected { background: #e67e22 !important; border-color: #d35400; }
    .compact-zone-btn.defend-selected { background: #3498db !important; border-color: #2980b9; }

    #strike-action-btn {
      width: 100%; background: var(--btn); color: white; border: none;
      padding: 8px; font-size: 12px; font-weight: bold; border-radius: 6px;
      cursor: pointer; margin-top: 4px; text-transform: uppercase;
    }
    #strike-action-btn:disabled { background: #57606f !important; opacity: 0.4; cursor: not-allowed; }

    /* Полосы ХП */
    .hp-wrapper { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .hp-bar { width: 100%; height: 6px; background: rgba(255, 255, 255, 0.1); border-radius: 3px; overflow: hidden; }
    .hp-fill { height: 100%; background: var(--success); width: 100%; transition: width 0.3s ease; }
    .enemy-hp .hp-fill { background: var(--danger); }
    .hp-text { font-size: 9px; color: var(--hint); font-family: monospace; }

    /* ============================================================================
       ===== 🗂️ СРЕДНЯЯ ЗОНА: СПИСКИ ОСТАЛЬНЫХ УЧАСТНИКОВ (МАССОВКА) =====
       ============================================================================ */
    .reserve-zone { display: flex; justify-content: space-between; gap: 10px; }
    .reserve-column {
      flex: 1; display: flex; flex-direction: column; gap: 4px;
      background: rgba(0, 0, 0, 0.1); padding: 4px; border-radius: 8px;
      max-height: 110px; overflow-y: auto;
    }

    .mini-fighter-card {
      background: var(--card); border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 6px; padding: 4px 6px; display: flex;
      align-items: center; justify-content: space-between; gap: 4px; cursor: pointer;
    }
    .mini-fighter-card.active-target { border: 1px solid var(--danger); background: rgba(231, 76, 60, 0.08); }
    .mini-fighter-card.dead { opacity: 0.25; pointer-events: none; }
    .mini-fighter-info { font-size: 10px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 65px; }

    /* Нижняя зона */
    .battle-bottom { flex: 1; display: flex; flex-direction: column; gap: 4px; min-height: 100px; }
    #battle-potion-btn {
      width: 100%; background: var(--success); color: white; border: none;
      padding: 8px; border-radius: 8px; font-weight: bold; font-size: 12px; cursor: pointer; display: none;
    }
    .battle-log {
      flex: 1; background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px; padding: 8px; font-size: 12px; line-height: 1.3; font-family: monospace; overflow-y: auto;
    }
    .log-round-break { color: var(--hint); margin: 4px 0; border-top: 1px dashed rgba(255,255,255,0.05); padding-top: 4px; font-weight: bold; }
    .log-damage { color: var(--danger); }
    .log-system { color: #f1c40f; font-weight: bold; }
    .log-miss { color: #95a5a6; }

    #battle-loading-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: var(--bg); z-index: 9999; display: flex;
      flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    }
    .spinner { width: 32px; height: 32px; border: 3px solid rgba(255,255,255,0.1); border-left-color: var(--btn); border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- Экран загрузки -->
  <div id="battle-loading-overlay">
    <div class="spinner"></div>
    <div style="font-weight: bold; color: var(--hint); font-size: 13px;">Сборка тактического дуэльного экрана...</div>
  </div>

  <div id="battle-screen">
    <div id="battle-round-indicator" class="battle-header">Подключение к арене...</div>

    <!-- 1. ВЕРХНИЙ БЛОК: ДУЭЛЬ ГЕРОЯ С ВЫБРАННОЙ ЦЕЛЬЮ -->
    <div class="duel-zone">
      <!-- ЛЕВАЯ КАРТОЧКА: Ваш герой -->
      <div id="main-hero-card" class="big-fighter-card">
        <div class="big-lvl" id="hero-lvl-text">Lv. --</div>
        <div class="big-avatar">👤</div>
        <div class="big-name" id="hero-name-text">Загрузка...</div>
        <div class="hp-wrapper">
          <div class="hp-bar"><div id="hero-hp-fill" class="hp-fill"></div></div>
          <div class="hp-text" id="hero-hp-text">0 / 0</div>
        </div>
      </div>

      <!-- ЦЕНТРАЛЬНЫЙ ПУЛЬТ: Кнопки атаки и защиты -->
      <div class="tactical-center-controls">
        <div class="mini-title">⚔️ Удар (Выбрать 1)</div>
        <div class="compact-zone-row">
          <button class="compact-zone-btn btn-atk" data-zone="head">Глв</button>
          <button class="compact-zone-btn btn-atk" data-zone="breast">Грд</button>
          <button class="compact-zone-btn btn-atk" data-zone="torso">Трс</button>
          <button class="compact-zone-btn btn-atk" data-zone="belt">Пяс</button>
          <button class="compact-zone-btn btn-atk" data-zone="legs">Нг</button>
        </div>

        <div class="mini-title" style="margin-top: 4px;">🛡️ Блок (Выбрать 2)</div>
        <div class="compact-zone-row">
          <button class="compact-zone-btn btn-def" data-zone="head">Глв</button>
          <button class="compact-zone-btn btn-def" data-zone="breast">Грд</button>
          <button class="compact-zone-btn btn-def" data-zone="torso">Трс</button>
          <button class="compact-zone-btn btn-def" data-zone="belt">Пяс</button>
          <button class="compact-zone-btn btn-def" data-zone="legs">Нг</button>
        </div>

        <button id="strike-action-btn" disabled>Ударить</button>
      </div>

      <!-- ПРАВАЯ КАРТОЧКА: Выбранная цель (Враг) -->
      <div id="main-target-card" class="big-fighter-card" style="border-color: rgba(231, 76, 60, 0.4);">
        <div class="big-lvl" id="target-lvl-text">Lv. --</div>
        <div class="big-avatar" id="target-avatar-text">👹</div>
        <div class="big-name" id="target-name-text">Нет цели</div>
        <div class="hp-wrapper enemy-hp">
          <div class="hp-bar"><div id="target-hp-fill" class="hp-fill"></div></div>
          <div class="hp-text" id="target-hp-text">0 / 0</div>
        </div>
      </div>
    </div>

    <!-- 2. СРЕДНИЙ БЛОК: ВСЕ ОСТАЛЬНЫЕ УЧАСТНИКИ МАССОВКИ -->
    <div class="reserve-zone">
      <div class="reserve-zone-col" style="flex: 1; display: flex; flex-direction: column; gap: 2px;">
        <div class="mini-title" style="text-align: left; padding-left: 4px;">👥 Ваш отряд:</div>
        <div id="allies-reserve-list" class="reserve-column"></div>
      </div>
      
      <div class="reserve-zone-col" style="flex: 1; display: flex; flex-direction: column; gap: 2px;">
        <div class="mini-title" style="text-align: left; padding-left: 4px;">🎯 Все противники:</div>
        <div id="enemies-reserve-list" class="reserve-column"></div>
      </div>
    </div>

    <!-- 3. НИЖНИЙ БЛОК: ОКОН ЛОГОВ И КНОПКА ЗЕЛИЯ -->
    <div class="battle-bottom">
      <button id="battle-potion-btn">🧪 Использовать зелье</button>
      <div id="battle-log-viewport" class="battle-log">
        <div class="log-system">Синхронизация логов с сервером...</div>
      </div>
    </div>
  </div>

</body>
<script>
    // 🔥 ЗАЩИТА ОТ ЛОЖНЫХ ПЕРЕЗАГРУЗОК ТЕЛЕГРАМА В БОЮ
    (function() {
        // 1. Перехватываем стандартную команду location.reload
        const originalReload = window.location.reload;
        window.location.reload = function(forceReload) {
        // Если бой еще идет (нет кнопки завершения), полностью блокируем перезагрузку!
        const strikeBtn = document.getElementById('strike-action-btn');
        if (strikeBtn && !strikeBtn.textContent.includes('ГОРОД')) {
            console.warn("🛡️ Попытка ложной перезагрузки страницы заблокирована боевым щитом!");
            return; 
        }
        // Если бой официально завершен, разрешаем обычный релоад
        originalReload.call(window.location, forceReload);
        };

        // 2. Ломаем встроенный обработчик Telegram message 'reload_iframe'
        const originalAddEventListener = window.addEventListener;
        window.addEventListener = function(type, listener, options) {
        if (type === 'message') {
            const safeListener = function(event) {
            // Если прилетел приказ от Телеграма обновить фрейм во время драки — игнорируем его
            if (event.data && event.data.includes('reload_iframe')) {
                console.warn("🛡️ Телеграм пытался обновить окно боя в раунде. Команда проигнорирована.");
                return;
            }
            listener(event);
            };
            return originalAddEventListener.call(window, type, safeListener, options);
        }
        return originalAddEventListener.call(window, type, listener, options);
        };
    })();
    </script>
</html>
