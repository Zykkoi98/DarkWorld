<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Битва Чести — Dark World</title>
      <!-- 1. Библиотека Supabase (Загружается первой) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
   <script src="https://cdn.socket.io/4.8.3/socket.io.min.js"></script>
    <script src="../config.js" defer></script>
    <script src="client_battle.js" defer></script>
  
  <style>
    /* ============================================================================
       ===== 🎨 СТИЛИ ИНТЕРФЕЙСА МАССОВОГО БОЯ (BATTLE.CSS ВНУТРИ HTML) =====
       ============================================================================ */
    :root {
      --bg: #1a1a2e;
      --text: #ffffff;
      --hint: #9aa0b5;
      --btn: #6c5ce7;
      --danger: #e74c3c;
      --success: #2ecc71;
      --card: rgba(255, 255, 255, 0.05);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 12px;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    #battle-screen {
      max-width: 480px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      height: 100%;
      gap: 10px;
    }

    /* Заголовок раундов */
    .battle-header {
      text-align: center;
      font-size: 16px;
      font-weight: bold;
      color: #f1c40f;
      padding: 4px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* Сетки команд (до 5 участников в каждой) */
    .team-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 8px;
      min-height: 80px;
      max-height: 160px;
      overflow-y: auto;
      padding: 4px;
    }

    /* Прямоугольник бойца */
    .fighter-card {
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 6px 8px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 4px;
      position: relative;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    /* Эффект выбора цели (Таргетинг) для врагов */
    .fighter-card.target-selected {
      border: 2px solid var(--danger);
      background: rgba(231, 76, 60, 0.15);
      box-shadow: 0 0 10px rgba(231, 76, 60, 0.4);
    }

    /* Если боец мертв */
    .fighter-card.dead {
      opacity: 0.35;
      background: rgba(0, 0, 0, 0.4) !important;
      border-color: rgba(255, 255, 255, 0.05) !important;
      box-shadow: none !important;
      pointer-events: none;
    }

    .fighter-info {
      font-size: 13px;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .fighter-lvl {
      font-size: 10px;
      color: #f1c40f;
    }

    /* Шкалы здоровья внутри прямоугольников */
    .fighter-hp-bar {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
      margin-top: 2px;
    }

    .fighter-hp-fill {
      height: 100%;
      background: var(--success);
      width: 100%;
      transition: width 0.3s ease;
    }

    .team-enemies .fighter-hp-fill {
      background: #e74c3c; /* Врагам красим полоску в красный */
    }

    .fighter-hp-text {
      font-size: 10px;
      color: var(--hint);
      font-family: monospace;
    }

    /* Статус-индикаторы над головой (выбрал ли ход) */
    .status-badge {
      position: absolute;
      top: -4px;
      right: -4px;
      font-size: 10px;
      background: #3498db;
      border-radius: 50%;
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    /* Центральный блок: Логи и Зелья */
    .battle-center {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 140px;
    }

    /* Кнопка быстрого питья банок */
    #battle-potion-btn {
      width: 100%;
      background: var(--success);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      display: none; /* Включается динамически из JS */
    }
    #battle-potion-btn:active { transform: scale(0.98); }

    /* Окно текстового лога */
    .battle-log {
      flex: 1;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 10px;
      font-size: 13px;
      line-height: 1.4;
      font-family: monospace;
      overflow-y: auto;
    }

    /* Стили текста логов */
    .log-round-break { color: var(--hint); margin: 6px 0; border-top: 1px dashed rgba(255,255,255,0.05); padding-top: 4px; font-weight: bold; }
    .log-hit { color: var(--success); }
    .log-damage { color: var(--danger); }
    .log-system { color: #f1c40f; font-weight: bold; }
    .log-miss { color: #95a5a6; }

    /* Панель выбора тактики (Низ) */
    .tactical-panel {
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .tactical-title {
      font-size: 12px;
      color: var(--hint);
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      text-align: center;
    }

    .zone-row {
      display: flex;
      gap: 6px;
      justify-content: space-between;
    }

    .zone-btn {
      flex: 1;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text);
      padding: 8px 4px;
      font-size: 12px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    /* Цвета при выборе тактики */
    .zone-btn.attack-selected { background: #e67e22 !important; border-color: #d35400; }
    .zone-btn.defend-selected { background: #3498db !important; border-color: #2980b9; }

    /* Главная кнопка удара */
    #strike-action-btn {
      width: 100%;
      background: var(--btn);
      color: white;
      border: none;
      padding: 14px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 4px;
      box-shadow: 0 4px 15px rgba(108, 92, 231, 0.3);
    }
    #strike-action-btn:disabled {
      background: #57606f !important;
      box-shadow: none;
      cursor: not-allowed;
      opacity: 0.6;
    }

    /* Шторка фоновой загрузки поединка */
    #battle-loading-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: var(--bg);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: opacity 0.3s ease;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 4px solid rgba(255,255,255,0.1);
      border-left-color: var(--btn);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(300deg); } }
  </style>
</head>
<body>

  <!-- Шторка загрузки -->
  <div id="battle-loading-overlay">
    <div class="spinner"></div>
    <div style="font-weight: bold; color: var(--hint);">Подготовка арены боя...</div>
  </div>

  <div id="battle-screen">
    <!-- Заголовок раундов -->
    <div id="battle-round-indicator" class="battle-header">Инициализация боя...</div>

    <!-- ВЕРХНЯЯ СЕТКА: Враги (Team B) -->
    <div class="tactical-title">🎯 Противники (Нажмите для выбора цели)</div>
    <div id="enemies-grid" class="team-grid team-enemies">
      <!-- Заполняется динамически прямоугольниками монстров/игроков через JS -->
    </div>

    <!-- ЦЕНТР: Логи поединка и Зелье -->
    <div class="battle-center">
      <button id="battle-potion-btn">🧪 Выпить зелье здоровья</button>
      <div id="battle-log-viewport" class="battle-log">
        <div class="log-system">Ожидание подключения к боевому серверу...</div>
      </div>
    </div>

    <!-- НИЖНЯЯ СЕТКА: Ваш отряд (Team A) -->
    <div class="tactical-title">🛡️ Ваш отряд</div>
    <div id="allies-grid" class="team-grid team-allies">
      <!-- Заполняется динамически прямоугольниками вашей команды через JS -->
    </div>

    <!-- ТАКТИЧЕСКАЯ ПАНЕЛЬ: Выбор ударов и блоков -->
    <div class="tactical-panel">
      <!-- Ряды Атаки -->
      <div class="tactical-title">⚔️ Зона вашей атаки (Выберите 1)</div>
      <div class="zone-row">
        <button class="zone-btn btn-atk" data-zone="head">Голова</button>
        <button class="zone-btn btn-atk" data-zone="breast">Грудь</button>
        <button class="zone-btn btn-atk" data-zone="torso">Торс</button>
        <button class="zone-btn btn-atk" data-zone="belt">Пояс</button>
        <button class="zone-btn btn-atk" data-zone="legs">Ноги</button>
      </div>

      <!-- Ряды Защиты -->
      <div class="tactical-title">🛡️ Зоны вашей защиты (Выберите 2)</div>
      <div class="zone-row">
        <button class="zone-btn btn-def" data-zone="head">Голова</button>
        <button class="zone-btn btn-def" data-zone="breast">Грудь</button>
        <button class="zone-btn btn-def" data-zone="torso">Торс</button>
        <button class="zone-btn btn-def" data-zone="belt">Пояс</button>
        <button class="zone-btn btn-def" data-zone="legs">Ноги</button>
      </div>

      <!-- Кнопка действия -->
