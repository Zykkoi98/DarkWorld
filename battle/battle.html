<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Битва Чести — Dark World</title>
  <!-- Официальный клиент Socket.io (версия 4.8.3, как в городе) -->
  <script src="https://cdn.socket.io/4.8.3/socket.io.min.js"></script>
  <script src="../config.js" defer></script>
  <script src="client_battle.js" defer></script>
  
  <style>
    :root {
      --bg: #0d0e15;
      --text: #ffffff;
      --hint: #636e72;
      --btn: #5f27cd;
      --danger: #ff4d4d;
      --success: #2ecc71;
      --card: rgba(255, 255, 255, 0.03);
      --border: rgba(255, 255, 255, 0.08);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }

    body {
      margin: 0; padding: 8px;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text);
      display: flex; flex-direction: column;
      height: 100vh; overflow: hidden;
    }

    #battle-screen {
      max-width: 480px; margin: 0 auto; width: 100%;
      display: flex; flex-direction: column; height: 100%; gap: 6px;
    }

    .battle-header {
      text-align: center; font-size: 15px; font-weight: bold; color: #f1c40f;
      padding: 2px 0; border-bottom: 1px solid var(--border);
    }

    /* ============================================================================
       ===== ⚔️ ИДЕАЛЬНО СИММЕТРИЧНАЯ ВЕРХНЯЯ ЗОНА: ДУЭЛЬ 1Х1 =====
       ============================================================================ */
    .duel-zone {
      display: flex;
      justify-content: space-between;
      align-items: stretch;
      gap: 6px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 14px;
      padding: 6px;
      border: 1px solid var(--border);
    }

/* 🔥 ЖЕСТКАЯ ФИКСАЦИЯ СИММЕТРИИ (БЕЗ ИСПОЛЬЗОВАНИЯ SPACE-BETWEEN) */
    .big-fighter-card {
      flex: 1;
      width: 125px;
      max-width: 125px;
      height: 180px; /* Фиксированная высота карточки */
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 4px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start; /* 🔥 Важно: выравниваем всё строго ОТ СВЕРХУ ВНИЗ */
    }
    /* Жесткий отступ под аватаром */
    .avatar-container {
      width: 68px;
      height: 68px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      overflow: hidden;
      background: #1e272e;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      flex-shrink: 0;
      margin-bottom: 12px; /* 🔥 Фиксированный шаг до имени */
    }

    .avatar-img {
      width: 68px;  /* 🔥 Жестко форсируем ширину под контейнер */
      height: 68px; /* 🔥 Жестко форсируем высоту под контейнер */
      display: block;
      object-fit: cover; 
      border-radius: 8px; /* 🔥 Картинка внутри тоже становится ровным квадратом */
    }

     /* Жесткий отступ под уровнем */
    .big-lvl { 
      font-size: 11px; 
      color: #f1c40f; 
      font-weight: bold; 
      margin-bottom: 6px; /* 🔥 Фиксированный шаг до аватара */
      height: 14px;
      line-height: 14px;
    }

   /* Имя с автопереносом на 2 строки и жесткой высотой */
    .big-name { 
      height: 32px; /* 🔥 Выделяем строго 2 строки текста */
      font-size: 11px; 
      font-weight: bold; 
      line-height: 1.3;
      width: 100%;
      white-space: normal; /* Разрешаем перенос */
      word-wrap: break-word;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #ffffff;
      margin-bottom: 10px; /* 🔥 Фиксированный шаг до полосы ХП */
    }
    /* ============================================================================
       ===== 🎛️ СТИЛЬНЫЕ НЕОНОВЫЕ ДВУХКОЛОННЫЕ КНОПКИ ТАКТИКИ =====
       ============================================================================ */
    .tactical-center-controls {
      flex: 1.6;
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: rgba(0, 0, 0, 0.4);
      padding: 6px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      justify-content: space-between;
    }

    .columns-wrapper { display: flex; gap: 6px; width: 100%; }
    .zone-column-box { flex: 1; display: flex; flex-direction: column; gap: 4px; }
    .mini-title { font-size: 9px; font-weight: bold; text-align: center; margin-bottom: 2px; letter-spacing: 0.5px; text-transform: uppercase; }
    
    .compact-zone-btn {
      width: 100%;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #b2bec3;
      padding: 8px 0;
      font-size: 11px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
      white-space: nowrap;
      text-transform: uppercase;
    }
    .compact-zone-btn:hover {
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
    }
    
    .compact-zone-btn.attack-selected { 
      background: linear-gradient(135deg, #ff9f43, #ee5253) !important; 
      border-color: #ff6b6b; 
      color: #fff !important;
      box-shadow: 0 0 10px rgba(238, 82, 83, 0.5);
    }
    
    .compact-zone-btn.defend-selected { 
      background: linear-gradient(135deg, #0abde3, #10ac84) !important; 
      border-color: #00d2d3; 
      color: #fff !important;
      box-shadow: 0 0 10px rgba(10, 189, 227, 0.5);
    }

    #strike-action-btn {
      width: 100%; background: linear-gradient(135deg, #70a1ff, #1e90ff); color: white; border: none;
      padding: 10px; font-size: 13px; font-weight: bold; border-radius: 6px;
      cursor: pointer; margin-top: 2px; text-transform: uppercase; letter-spacing: 0.5px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(30, 144, 255, 0.2);
    }
    #strike-action-btn:disabled { 
      background: #2c3e50 !important; color: #7f8c8d !important; 
      opacity: 0.4; cursor: not-allowed; box-shadow: none; 
    }

    /* Полосы ХП */
    .hp-wrapper {
      width: 100%;
      margin-top: auto; /* Прижимает ХП к самому низу карточки */
    }
    .hp-bar { width: 100%; height: 5px; background: rgba(255, 255, 255, 0.08); border-radius: 3px; overflow: hidden; border: 1px solid rgba(0,0,0,0.2); }
    .hp-fill { height: 100%; background: linear-gradient(90deg, #2ecc71, #26de81); width: 100%; transition: width 0.3s ease; }
    .enemy-hp .hp-fill { background: linear-gradient(90deg, #ff4757, #ff6b6b); }
    .hp-text { font-size: 13px; color: #a4b0be; font-family: monospace; font-weight: bold; }

    /* Списки участников */
    .reserve-zone { display: flex; justify-content: space-between; gap: 10px; }
    .reserve-column {
      flex: 1; display: flex; flex-direction: column; gap: 4px;
      background: rgba(0, 0, 0, 0.2); padding: 4px; border-radius: 8px;
      max-height: 105px; overflow-y: auto; border: 1px solid var(--border);
    }

    .mini-fighter-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 6px; padding: 4px 6px; display: flex;
      align-items: center; justify-content: space-between; gap: 4px; cursor: pointer;
    }
    .mini-fighter-card.active-target { border: 1px solid #ff4757; background: rgba(255, 71, 87, 0.08); }
    .mini-fighter-card.dead { opacity: 0.2; pointer-events: none; }
    .mini-fighter-info { font-size: 10px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 65px; color: #c8d6e5; }

    .battle-bottom { flex: 1; display: flex; flex-direction: column; gap: 4px; min-height: 100px; }
    #battle-potion-btn {
      width: 100%; background: var(--success); color: white; border: none;
      padding: 8px; border-radius: 8px; font-weight: bold; font-size: 12px; cursor: pointer; display: none;
    }
    .battle-log {
      flex: 1; background: rgba(0, 0, 0, 0.4); border: 1px solid var(--border);
      border-radius: 10px; padding: 8px; font-size: 12px; line-height: 1.3; font-family: monospace; overflow-y: auto;
    }
    .log-round-break { color: #f1c40f; margin: 4px 0; border-top: 1px dashed var(--border); padding-top: 4px; font-weight: bold; text-align: center; }
    .log-damage { color: #ff6b6b; }
    .log-system { color: #f1c40f; font-weight: bold; }
    .log-miss { color: #84817a; }

    #battle-loading-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: var(--bg); z-index: 9999; display: flex;
      flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    }
    .spinner { width: 32px; height: 32px; border: 3px solid rgba(255,255,255,0.1); border-left-color: #1e90ff; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    /* ============================================================================
       ===== 🧪 НОВЫЕ СТИЛИ ДЛЯ КНОПОК БАНОК И СВИТКОВ ПОД КАРТОЧКАМИ =====
       ============================================================================ */
    .quick-slots-row {
      display: flex;
      gap: 6px;
      width: 100%;
      max-width: 125px;
      margin-top: 6px;
    }

    .quick-action-btn {
      flex: 1;
      height: 36px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: #ffffff;
      font-size: 16px; /* Под эмодзи банки/свитка */
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }

    .quick-action-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .quick-action-btn:disabled {
      opacity: 0.15;
      cursor: not-allowed;
      box-shadow: none;
    }
    
  </style>
</head>
<body>

  <!-- Экран загрузки -->
  <div id="battle-loading-overlay">
    <div class="spinner"></div>
    <div style="font-weight: bold; color: #7f8c8d; font-size: 13px; font-family: sans-serif;">Синхронизация графики дуэли...</div>
  </div>

  <div id="battle-screen">
    <div id="battle-round-indicator" class="battle-header">Подключение к арене...</div>

 <!-- 1. ВЕРХНИЙ БЛОК: КОМПАКТНАЯ ДУЭЛЬ С БЫСТРЫМИ СЛОТАМИ РАСХОДНИКОВ -->
    <div class="duel-zone">
      
      <!-- ЛЕВАЯ СТОРОНА: Герой + Быстрые слоты -->
      <div style="display: flex; flex-direction: column; align-items: center;">
        <div id="main-hero-card" class="big-fighter-card">
          <div class="big-lvl" id="hero-lvl-text">Lv. --</div>
          <div class="avatar-container">
            <img id="hero-avatar-img" class="avatar-img" src="../assets/avatars/hero5.jpg" alt="Hero">
          </div>
          <div class="big-name" id="hero-name-text">Загрузка...</div>
          <div class="hp-wrapper">
            <div class="hp-bar"><div id="hero-hp-fill" class="hp-fill"></div></div>
            <div class="hp-text" id="hero-hp-text">0 / 0</div>
          </div>
        </div>
        
        <!-- 🔥 Кнопки банок и свитков строго ПОД вашей карточкой -->
        <div class="quick-slots-row">
          <button id="quick-potion-btn" class="quick-action-btn" title="Выпить зелье" disabled>🧪</button>
          <button id="quick-scroll-btn" class="quick-action-btn" title="Прочитать свиток" disabled>📜</button>
        </div>
      </div>

      <!-- ЦЕНТРАЛЬНЫЙ ПУЛЬТ ТАКТИКИ -->
      <div class="tactical-center-controls">
        <div class="columns-wrapper">
          <div class="zone-column-box">
            <div class="mini-title" style="color: #ff9f43;">УДАР</div>
            <button class="compact-zone-btn btn-atk" data-zone="head">Голова</button>
            <button class="compact-zone-btn btn-atk" data-zone="breast">Грудь</button>
            <button class="compact-zone-btn btn-atk" data-zone="torso">Живот</button>
            <button class="compact-zone-btn btn-atk" data-zone="belt">Пояс</button>
            <button class="compact-zone-btn btn-atk" data-zone="legs">Ноги</button>
          </div>

          <div class="zone-column-box">
            <div class="mini-title" style="color: #0abde3;">БЛОК</div>
            <button class="compact-zone-btn btn-def" data-zone="head">Голова</button>
            <button class="compact-zone-btn btn-def" data-zone="breast">Грудь</button>
            <button class="compact-zone-btn btn-def" data-zone="torso">Живот</button>
            <button class="compact-zone-btn btn-def" data-zone="belt">Пояс</button>
            <button class="compact-zone-btn btn-def" data-zone="legs">Ноги</button>
          </div>
        </div>
        <button id="strike-action-btn" disabled>АТАКОВАТЬ</button>
      </div>

      <!-- ПРАВАЯ СТОРОНА: Враг + Заглушки быстрых слотов (для симметрии) -->
      <div style="display: flex; flex-direction: column; align-items: center;">
        <div id="main-target-card" class="big-fighter-card">
          <div class="big-lvl" id="target-lvl-text">Lv. --</div>
          <div class="avatar-container" style="border-color: rgba(255, 71, 87, 0.2);">
            <img id="target-avatar-img" class="avatar-img" src="../assets/monsters/monster1.jpg" alt="Monster">
          </div>
          <div class="big-name" id="target-name-text">Нет цели</div>
          <div class="hp-wrapper enemy-hp">
            <div class="hp-bar"><div id="target-hp-fill" class="hp-fill"></div></div>
            <div class="hp-text" id="target-hp-text">0 / 0</div>
          </div>
        </div>
        
        <!-- Заглушки кнопок под монстром, чтобы пульт стоял идеально ровно -->
        <div class="quick-slots-row">
          <button class="quick-action-btn" disabled style="opacity: 0.05;">🛡️</button>
          <button class="quick-action-btn" disabled style="opacity: 0.05;">⚔️</button>
        </div>
      </div>

    </div>

    <!-- 2. СРЕДНИЙ БЛОК: МАССОВКА -->
    <div class="reserve-zone">
      <div style="flex: 1; display: flex; flex-direction: column; gap: 2px;">
        <div class="mini-title" style="text-align: left; padding-left: 4px; color: #2ecc71;">👥 Отряд:</div>
        <div id="allies-reserve-list" class="reserve-column"></div>
      </div>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 2px;">
        <div class="mini-title" style="text-align: left; padding-left: 4px; color: #ff4757;">🎯 Враги:</div>
        <div id="enemies-reserve-list" class="reserve-column"></div>
      </div>
    </div>

  
      <div id="battle-log-viewport" class="battle-log">
        <div class="log-system">Синхронизация логов с сервером...</div>
      </div>
    </div>
  </div>

</body>
</html>
