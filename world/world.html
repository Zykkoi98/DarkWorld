<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Карта мира — Dark World</title>
  <link rel="stylesheet" href="world.css?v=29">
</head>
<body>

  <!-- ======================= ЗАГРУЗКА ======================= -->
  <div id="world-loader" style="
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: #0b0c10; z-index: 9999;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: #fff; font-family: sans-serif;
  ">
    <div style="font-size: 40px; animation: spin 2s linear infinite;">🗺️</div>
    <div style="margin-top: 16px; font-size: 14px; color: #9aa0b5;">Загрузка карты мира...</div>
  </div>

  <!-- ======================= ШАПКА ======================= -->
  <div id="world-header">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <div>
        <h3 style="margin: 0; color: #6c5ce7; font-size: 18px;">🗺️ <span id="map-name">Ашенваль</span></h3>
        <div style="font-size: 11px; color: #9aa0b5; margin-top: 2px;">
          📍 Клетка (<span id="pos-x">25</span>, <span id="pos-y">25</span>)
        </div>
      </div>
      <button id="enter-city-btn" onclick="window.enterCity()" style="display: none; background: #f1c40f; border: none; color: #000; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 12px;">🏰 Войти в город</button>
    </div>
  </div>

  <!-- ======================= КАРТА ======================= -->
  <div id="world-map-container">
    <div id="world-map-inner">
      <img id="world-map-img" src="../assets/maps/world_ashenval_background.jpg" alt="">
      <div id="world-map-grid"></div>
    </div>
    <!-- ✅ Кнопка «Центр» — внутри контейнера, но СНАРУЖИ inner -->
    <button id="center-map-btn">🎯</button>
  </div>
  <!-- ✅ КОНТЕЙНЕР КАРТЫ ЗАКРЫТ ЗДЕСЬ -->

  <!-- ======================= ИНФО-ПАНЕЛЬ (2 КОЛОНКИ) ======================= -->
  <div id="world-info-panel">
    <div class="info-column" id="my-cell-panel">
      <div class="info-column-title">
        📍 Вы здесь
        <span id="my-cell-coords" style="float: right; color: #9aa0b5; font-weight: normal; font-size: 11px;">—</span>
      </div>
      <div id="my-cell-info"></div>
      <div id="my-cell-actions"></div>
    </div>
    <div class="info-column hidden" id="selected-cell-panel">
      <div class="info-column-title">
        🔍 Выбрано
        <span id="selected-cell-coords" style="float: right; color: #9aa0b5; font-weight: normal; font-size: 11px;">—</span>
      </div>
      <div id="selected-cell-info"></div>
      <div id="selected-cell-actions"></div>
    </div>
  </div>

  <script src="https://cdn.socket.io/4.8.3/socket.io.min.js"></script>
  <script src="world_client.js?v=29"></script>
</body>
</html>
