<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:;">
  <title>Карта мира — Dark World</title>

  <!-- Библиотеки -->
  <script src="https://cdn.socket.io/4.8.3/socket.io.min.js"></script>

  <!-- Стили -->
  <link rel="stylesheet" href="../style.css?v=78">
  <link rel="stylesheet" href="../shared/ui.css?v=1">
  <link rel="stylesheet" href="world.css?v=34">

  <!-- Конфиги -->
  <script src="../config.js?v=12" defer></script>
  <script src="../shared/ui.js?v=12" defer></script>
  <script src="../shop/shop_items_config.js"></script>
</head>
<body>

  <!-- ======================= ЗАГРУЗКА ======================= -->
  <div id="world-loader" style="
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: #0b0c10; z-index: 9999;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: #fff; font-family: sans-serif;
  ">
    <div style="font-size: 40px; animation: spin 2s linear infinite;">🗺️</div>
    <div style="margin-top: 16px; font-size: 14px; color: #9aa0b5;">Загрузка карты мира...</div>
  </div>

  <!-- ======================= ШАПКА ======================= -->
  <div class="player-header card" id="world-player-header">
    <div class="player-avatar-slot" id="world-avatar-slot">
      <img id="world-player-avatar" src="../assets/avatars/hero1.png" alt="Аватар">
      <div class="hp-overlay">
        <div class="hp-overlay-bar">
          <div class="hp-overlay-fill" id="world-hp-fill"></div>
        </div>
        <div class="hp-overlay-text" id="world-hp-badge">0 / 0</div>
      </div>
    </div>

    <div class="player-meta">
      <div class="player-meta-name-row">
        <span class="player-meta-name" id="world-player-name">Загрузка...</span>
        <span class="player-meta-level" id="world-player-level">Lv. 1</span>
      </div>
      <div class="player-meta-title" id="world-map-title">🗺️ Ашенваль</div>
    </div>

    <button class="inv-toggle-btn" id="world-inventory-btn">🎒</button>
  </div>

  <!-- ======================= КАРТА ======================= -->
  <div id="world-map-container">
    <div id="world-map-inner">
      <img id="world-map-img" src="../assets/maps/world_ashenval_background.jpg" alt="">
      <div id="world-map-grid"></div>
    </div>
    <button id="center-map-btn">🎯</button>
  </div>

  <!-- ======================= ИНФО-ПАНЕЛЬ ======================= -->
  <div id="world-info-panel">
    <div class="info-column" id="my-cell-panel">
      <div class="info-column-title">
        📍 Вы здесь
        <span id="my-cell-coords" style="float: right; color: #9aa0b5; font-weight: normal; font-size: 11px;">—</span>
      </div>
      <div id="my-cell-info"></div>
      <div id="my-cell-actions"></div>
      <div id="my-cell-enter-actions"></div>
    </div>
    <div class="info-column hidden" id="selected-cell-panel">
      <div class="info-column-title">
        🔍 Выбрано
        <span id="selected-cell-coords" style="float: right; color: #9aa0b5; font-weight: normal; font-size: 11px;">—</span>
      </div>
      <div id="selected-cell-info"></div>
      <div id="selected-cell-actions"></div>
    </div>
  </div>

  <!-- Модалки профиля / инвентаря / поповера создаст UI.init() из shared/ui.js -->

  <script src="world_client.js?v=12"></script>
</body>
</html>
