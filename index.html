<!DOCTYPE html>
<html lang="ru">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:;">

  <title>Dark World</title>

  <!-- 1. Библиотека Supabase (Загружается первой) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- 2. Официальный SDK Telegram (СТРОГО С ЗАКРЫВАЮЩИМ ТЕГОМ) -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <script src="https://cdn.socket.io/4.8.3/socket.io.min.js"></script>

  <!-- 3. Стили игры -->
  <link rel="stylesheet" href="style.css">

  <!-- 4. Игровые скрипты СТРОГО с параметром defer -->
  <script src="config.js" defer></script>
  <script src="telegram.js" defer></script>
  <script src="equipment.js" defer></script>
  <script src="shop.js" defer></script>
  <script src="client_pvp.js" defer></script>
  <script src="game.js" defer></script>
</head>
<body>
  <div id="app">
    <!-- ============================================================================
         ===== 🏰 ГЛАВНЫЙ ЭКРАН ИГРЫ (ИНТЕРФЕЙС ГОРОДА) =====
         ============================================================================ -->
    
    <!-- Шапка персонажа на главном экране -->
    <div class="player-header card">
      <!-- Слот аватарки игрока с плашкой уровня -->
      <div class="player-avatar-slot" id="player-avatar-slot">
        <img id="player-avatar" src="assets/avatars/hero1.png" alt="Аватар">
        <div class="lvl-badge" id="player-lvl-badge">Lv. 1</div>
      </div>
      
      <!-- Мета-данные игрока -->
      <div class="player-meta">
        <div class="player-meta-name" id="player-name">Загрузка...</div>
        <div class="player-meta-title">Искатель приключений</div>
      </div>
      
      <!-- Кнопка вызова Рюкзака (Инвентаря) -->
      <button class="inv-toggle-btn" id="inventory-toggle-btn">🎒</button>
    </div>

    <!-- Заголовок текущего города -->
    <div id="current-town-name">Ашенваль</div>

    <!-- Сетка локаций города (сюда JS динамически рендерит кнопки зданий) -->
    <div class="location-grid" id="town-locations"></div>

  </div> <!-- /#app -->


  <!-- ============================================================================
       ===== 🪟 МОДАЛЬНОЕ ОКНО ПРОФИЛЯ И ХАРАКТЕРИСТИК =====
       ============================================================================ -->
  <div id="profile-modal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h3>📊 Профиль Героя</h3>
        <button class="close-btn" id="profile-close-btn">✕</button>
      </div>
      <!-- Сюда JS безопасно выводит характеристики и кнопки распределения очков -->
      <div class="modal-body-stats"></div>
    </div>
  </div>


  <!-- ============================================================================
       ===== 🎒 МОДАЛЬНОЕ ОКНО ИНВЕНТАРЯ И СНАРЯЖЕНИЯ (КУКЛА НА 11 СЛОТОВ) =====
       ============================================================================ -->
  <div id="inventory-modal" class="modal-overlay">
    <div class="modal-content" style="max-height: 95vh; width: 100%; max-width: 480px; display: flex; flex-direction: column; padding: 12px 8px; border-radius: 20px 20px 0 0; margin: 0 auto;">
      
      <!-- Шапка инвентаря -->
      <div class="modal-header" style="margin-bottom: 12px; padding: 0 4px;">
        <h3 style="font-size: 16px; margin: 0;">🎒 Инвентарь и Снаряжение</h3>
        <button class="close-btn" id="inventory-close-btn" style="width: 32px; height: 32px; font-size: 14px;">✕</button>
      </div>

      <!-- 🛡️ КУКЛА ПЕРСОНАЖА (11 слотов вокруг большого вертикального аватара) -->
      <div style="display: flex; justify-content: center; align-items: center; background: rgba(0, 0, 0, 0.2); padding: 12px 4px; border-radius: 12px; margin-bottom: 12px; border: 1px solid rgba(255, 255, 255, 0.05); width: 100%;">
        
        <div style="display: grid; grid-template-columns: repeat(5, 70px); grid-template-rows: repeat(5, 60px); gap: 6px; justify-content: center; align-items: center; position: relative; width: 100%; max-width: 380px; margin: 0 auto;">
          
          <!-- Центр: Вертикальный аватар героя -->
          <div style="grid-column: 2 / 5; grid-row: 1 / 5; width: 100%; height: 258px; border-radius: 10px; border: 2px solid var(--btn); overflow: hidden; background: #000; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(0,0,0,0.4);">
            <img id="inv-hero-avatar" src="assets/avatars/hero1.png" style="width: 100%; height: 100%; object-fit: cover;">
          </div>

          <!-- Левая колонка (4 слота) -->
          <div class="inv-slot" id="eslot-head" data-slot="head" style="grid-column: 1; grid-row: 1; background: rgba(255,255,255,0.03); border: 1px dashed rgba(255,255,255,0.25); opacity: 0.85; width: 70px; height: 60px; margin: 0; font-size: 20px;" title="Голова (Шлем)">🪖</div>
          <div class="inv-slot" id="eslot-neck" data-slot="neck" style="grid-column: 1; grid-row: 2; background: rgba(255,255,255,0.03); border: 1px dashed rgba(255,255,255,0.25); opacity: 0.85; width: 70px; height: 60px; margin: 0; font-size: 20px;" title="Шея (Амулет)">📿</div>
          <div class="inv-slot" id="eslot-gloves" data-slot="gloves" style="grid-column: 1; grid-row: 3; background: rgba(255,255,255,0.03); border: 1px dashed rgba(255,255,255,0.25); opacity: 0.85; width: 70px; height: 60px; margin: 0; font-size: 20px;" title="Руки (Перчатки)">🧤</div>
          <div class="inv-slot" id="eslot-mainHand" data-slot="mainHand" style="grid-column: 1; grid-row: 4; background: rgba(255,255,255,0.03); border: 1px dashed rgba(255,255,255,0.25); opacity: 0.85; width: 70px; height: 60px; margin: 0; font-size: 20px;" title="Правая рука (Оружие)">⚔️</div>

          <!-- Правая колонка (4 слота) -->
          <div class="inv-slot" id="eslot-body" data-slot="body" style="grid-column: 5; grid-row: 1; background: rgba(255,255,255,0.03); border: 1px dashed rgba(255,255,255,0.25); opacity: 0.85; width: 70px; height: 60px; margin: 0; font-size: 20px;" title="Тело (Броня)">👕</div>
          <div class="inv-slot" id="eslot-legs" data-slot="legs" style="grid-column: 5; grid-row: 2; background: rgba(255,255,255,0.03); border: 1px dashed rgba(255,255,255,0.25); opacity: 0.85; width: 70px; height: 60px; margin: 0; font-size: 20px;" title="Ноги (Сапоги)">🥾</div>
          <div class="inv-slot" id="eslot-extra" data-slot="extra" style="grid-column: 5; grid-row: 3; background: rgba(255,255,255,0.03); border: 1px dashed rgba(255,255,255,0.25); opacity: 0.85; width: 70px; height: 60px; margin: 0; font-size: 20px;" title="Особый слот">✨</div>
          <div class="inv-slot" id="eslot-offHand" data-slot="offHand" style="grid-column: 5; grid-row: 4; background: rgba(255,255,255,0.03); border: 1px dashed rgba(255,255,255,0.25); opacity: 0.85; width: 70px; height: 60px; margin: 0; font-size: 20px;" title="Левая рука (Щит)">🛡️</div>
          <!-- Зелье слева -->
          <div id="eslot-potion" class="inv-slot">🧪</div>
          <!-- Нижний ряд (3 слота под кольца) -->
          <div class="inv-slot" id="eslot-ring-0" data-slot="ring" data-index="0" style="grid-column: 2; grid-row: 5; background: rgba(255,255,255,0.03); border: 1px dashed rgba(255,255,255,0.25); opacity: 0.85; width: 70px; height: 60px; margin: 0; font-size: 20px;" title="Кольцо 1">💍</div>
          <div class="inv-slot" id="eslot-ring-1" data-slot="ring" data-index="1" style="grid-column: 3; grid-row: 5; background: rgba(255,255,255,0.03); border: 1px dashed rgba(255,255,255,0.25); opacity: 0.85; width: 70px; height: 60px; margin: 0; font-size: 20px;" title="Кольцо 2">💍</div>
          <div class="inv-slot" id="eslot-ring-2" data-slot="ring" data-index="2" style="grid-column: 4; grid-row: 5; background: rgba(255,255,255,0.03); border: 1px dashed rgba(255,255,255,0.25); opacity: 0.85; width: 70px; height: 60px; margin: 0; font-size: 20px;" title="Кольцо 3">💍</div>
          <!-- Свиток справа -->
          <div id="eslot-scroll" class="inv-slot">📜</div>

        </div>
      </div>

      <!-- Вкладки рюкзака (строго внутри инвентаря) -->
      <div class="inv-tabs" style="margin-bottom: 8px; width: 100%;">
        <button class="inv-tab active" id="tab-btn-equipment" style="font-size: 13px; padding: 8px 4px;">Амуниция</button>
        <button class="inv-tab" id="tab-btn-resources" style="font-size: 13px; padding: 8px 4px;">Ресурсы</button>
        <button class="inv-tab" id="tab-btn-consumables" style="font-size: 13px; padding: 8px 4px;">Расходники</button>
      </div>

      <!-- Контент содержимого рюкзака (строго внутри инвентаря) -->
      <div class="inv-content" id="inventory-content" style="flex: 1; min-height: 180px; width: 100%; display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 8px; justify-items: center;"></div>

    </div>
  </div>


  <!-- ============================================================================
       ===== ⚔️ ДИНАМИЧЕСКОЕ МОДАЛЬНОЕ ОКНО ДЛЯ БОЕВОЙ СИСТЕМЫ =====
       ============================================================================ -->
  <!-- Содержимое этого окна подгружается через fetch из battle_template.html -->
  <div id="battle-modal" class="modal-overlay" style="z-index: 2000;"></div>
  <div id="shop-modal" class="modal-overlay"></div>

  <!-- ============================================================================
       ===== ⚙️ ПОДДКЛЮЧЕНИЕ СКРИПТОВ (СТРОГИЙ ПОРЯДОК ЗАГРУЗКИ) =====
       ============================================================================ -->

</body>
