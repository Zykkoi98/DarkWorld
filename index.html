<!DOCTYPE html>
<html lang="ru">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:;">

  <title>Dark World</title>

  <!-- 1. Библиотеки -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.socket.io/4.8.3/socket.io.min.js"></script>

  <!-- 2. Стили -->
  <link rel="stylesheet" href="style.css?v=78">
  <link rel="stylesheet" href="shared/ui.css?v=1">

  <!-- 3. Скрипты (defer) -->
  <script src="config.js?v=111" defer></script>
  <script src="shared/ui.js?v=113" defer></script>
  <script src="equipment.js?v=111" defer></script>
  <script src="game.js?v=111" defer></script>
  <script src="telegram.js?v=111" defer></script>
  <script src="shop/shop_items_config.js"></script>

  <script>
  (function() {
    console.log("🔍 Экспресс-проверка боевого статуса...");
    document.documentElement.style.background = "#1a1a2e";

    const tgData = window.Telegram?.WebApp?.initDataUnsafe?.user;
    let userId = tgData?.id;

    if (!userId) {
      try {
        const localSave = localStorage.getItem('rpg_save');
        if (localSave) userId = JSON.parse(localSave).player.id;
      } catch (e) {}
    }

    if (!userId) {
      window.addEventListener('DOMContentLoaded', () => {
        setTimeout(hideMainGameLoader, 200);
      });
      return;
    }

    window.hideMainGameLoader = function() {
      const loader = document.getElementById('game-loader-screen');
      if (loader) {
        loader.style.display = 'none';
        loader.style.opacity = '0';
        loader.style.zIndex = '-1';
      } else {
        const backupLoader = document.querySelector('[id*="loader"]');
        if (backupLoader) backupLoader.style.display = 'none';
      }
    };
  })();
  </script>
</head>
<body>

  <!-- Экран загрузки -->
  <div id="game-loader-screen" style="
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: #1a1a2e; z-index: 999999;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 16px; font-family: -apple-system, sans-serif; color: #fff;
  ">
    <div style="font-size: 40px; animation: spin 2s linear infinite;">⏳</div>
    <div style="font-size: 18px; font-weight: bold; color: #f1c40f;">Синхронизация с облаком...</div>
    <div style="font-size: 12px; color: #9aa0b5;">Пожалуйста, подождите</div>
  </div>

  <style>
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>

  <div id="app">
    <!-- Шапка персонажа -->
    <div class="player-header card">
      <div class="player-avatar-slot" id="player-avatar-slot">
        <img id="player-avatar" src="assets/avatars/hero1.png" alt="Аватар">
        <div class="hp-overlay">
          <div class="hp-overlay-bar">
            <div class="hp-overlay-fill" id="player-hp-fill"></div>
          </div>
          <div class="hp-overlay-text" id="player-hp-badge">0 / 0</div>
        </div>
      </div>

      <div class="player-meta">
        <div class="player-meta-name-row">
          <span class="player-meta-name" id="player-name">Загрузка...</span>
          <span class="player-meta-level" id="player-lvl-text">Lv. 1</span>
        </div>
        <div class="player-meta-title">Искатель приключений</div>
      </div>

      <button class="inv-toggle-btn" id="inventory-toggle-btn">🎒</button>
    </div>

    <div id="current-town-name">Ашенваль</div>
    <div class="location-grid" id="town-locations"></div>
  </div>

  <!-- ============================================================================
       ===== iframe-обёртки для оверлеев (магазин, арена, башня) =====
       ============================================================================ -->

  <!-- МАГАЗИН -->
  <div id="shop-iframe-wrapper" style="display:none;position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:100%;background:var(--bg);z-index:1500;">
    <div style="display:flex;flex-direction:column;width:100%;height:100%;padding:16px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;border-bottom:1px solid rgba(255,255,255,0.08);padding-bottom:8px;">
        <h3 style="margin:0;font-size:20px;color:#f1c40f;">🏪 Торговая Лавка</h3>
      </div>
      <iframe id="shop-iframe-frame" src="about:blank" style="width:100%;flex:1;border:none;background:transparent;border-radius:12px;"></iframe>
    </div>
  </div>

  <!-- АРЕНА -->
  <div id="arena-iframe-wrapper" style="display:none;position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:100%;background:var(--bg);z-index:1500;">
    <div style="display:flex;flex-direction:column;width:100%;height:100%;padding:16px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;border-bottom:1px solid rgba(255,255,255,0.08);padding-bottom:8px;">
        <h3 style="margin:0;font-size:20px;color:#f1c40f;">🏆 Колизей Гладиаторов</h3>
      </div>
      <iframe id="arena-iframe-frame" src="about:blank" style="width:100%;flex:1;border:none;background:transparent;border-radius:12px;"></iframe>
    </div>
  </div>

  <!-- БАШНЯ -->
  <div id="tower-iframe-wrapper" style="display:none;position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:100%;background:var(--bg);z-index:1500;">
    <div style="display:flex;flex-direction:column;width:100%;height:100%;padding:16px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;border-bottom:1px solid rgba(255,255,255,0.08);padding-bottom:8px;">
        <h3 style="margin:0;font-size:20px;color:#6c5ce7;">🏰 Тёмная Башня</h3>
      </div>
      <iframe id="tower-iframe-frame" src="about:blank" style="width:100%;flex:1;border:none;background:transparent;border-radius:12px;"></iframe>
    </div>
  </div>

  <script src="global_battle_watch.js?v=111"></script>
</body>
</html>
