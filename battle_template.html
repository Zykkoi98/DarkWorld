<div class="modal-content battle-content-box" style="max-height: 98vh; padding: 12px; position: relative;">
  
  <!-- 👤 Шапка боя с именами -->
  <div class="modal-header" style="margin-bottom: 8px;">
    <h3 id="battle-title" style="font-size: 16px;">Пошаговый поединок</h3>
    <button id="battle-close-btn" class="close-btn" style="display: none;">✕</button>
  </div>

  <!-- 🏟️ ГЛАВНАЯ ВЕРТИКАЛЬНАЯ АРЕНА БОЯ -->
  <div style="display: flex; justify-content: space-between; gap: 8px; margin-bottom: 10px; align-items: stretch;">
    
    <!-- ЛЕВАЯ СТОРОНА: ИГРОК -->
    <div id="bf-player-avatar-click" style="flex: 1; background: #000; border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; position: relative; cursor: pointer; min-height: 180px; overflow: hidden; padding: 0;">
      
      <!-- Абсолютно яркая картинка аватара на весь фон (прозрачность 100%) -->
      <img id="bf-player-avatar" src="assets/avatars/hero1.png" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; opacity: 1; z-index: 1; pointer-events: none;">
      
      <!-- Контент поверх фона: Черная информационная плашка в самом низу карточки (z-index: 2) -->
      <div style="width: 100%; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(2px); border-top: 1px solid rgba(255, 255, 255, 0.15); padding: 6px 8px; z-index: 2; display: flex; flex-direction: column; gap: 4px;">
        <div id="bf-player-name" class="battle-char-name" style="font-size: 13px; font-weight: bold; text-align: center; color: #fff; text-shadow: 0 1px 2px #000;">Вы</div>
        <div class="hp-bar-bg" style="margin: 0; background: rgba(255,255,255,0.2);"><div id="bf-player-hp-fill" class="hp-bar-fill"></div></div>
        <div id="bf-player-hp-text" class="battle-char-hp-text" style="font-size: 11px; text-align: center; color: #fff; font-weight: bold; margin: 0; text-shadow: 0 1px 2px #000;">0/0</div>
      </div>
    </div>

    <!-- 🎯 ЦЕНТРАЛЬНЫЙ БЛОК: ВЕРТИКАЛЬНЫЕ ЗОНЫ И КНОПКИ УПРАВЛЕНИЯ (Ширина 160px) -->
    <div style="width: 160px; display: flex; flex-direction: column; gap: 4px; justify-content: center;">
      <div style="display: flex; justify-content: space-between; font-size: 9px; font-weight: bold; text-align: center; margin-bottom: 2px;">
        <span style="color: #e67e22; flex: 1;">АТАКА (1)</span>
        <span style="color: #3498db; flex: 1;">ЗАЩИТА (2)</span>
      </div>
      <div style="display: flex; gap: 3px;">
        <button class="loc-btn attack-zone-btn" data-zone="head" style="padding: 6px 2px; font-size: 11px; flex: 1; margin: 0;">⚔️ Голова</button>
        <button class="loc-btn defend-zone-btn" data-zone="head" style="padding: 6px 2px; font-size: 11px; flex: 1; margin: 0;">🛡️ Голова</button>
      </div>
      <div style="display: flex; gap: 3px;">
        <button class="loc-btn attack-zone-btn" data-zone="breast" style="padding: 6px 2px; font-size: 11px; flex: 1; margin: 0;">⚔️ Грудь</button>
        <button class="loc-btn defend-zone-btn" data-zone="breast" style="padding: 6px 2px; font-size: 11px; flex: 1; margin: 0;">🛡️ Грудь</button>
      </div>
      <div style="display: flex; gap: 3px;">
        <button class="loc-btn attack-zone-btn" data-zone="torso" style="padding: 6px 2px; font-size: 11px; flex: 1; margin: 0;">⚔️ Торс</button>
        <button class="loc-btn defend-zone-btn" data-zone="torso" style="padding: 6px 2px; font-size: 11px; flex: 1; margin: 0;">🛡️ Торс</button>
      </div>
      <div style="display: flex; gap: 3px;">
        <button class="loc-btn attack-zone-btn" data-zone="belt" style="padding: 6px 2px; font-size: 11px; flex: 1; margin: 0;">⚔️ Пояс</button>
        <button class="loc-btn defend-zone-btn" data-zone="belt" style="padding: 6px 2px; font-size: 11px; flex: 1; margin: 0;">🛡️ Пояс</button>
      </div>
      <div style="display: flex; gap: 3px;">
        <button class="loc-btn attack-zone-btn" data-zone="legs" style="padding: 6px 2px; font-size: 11px; flex: 1; margin: 0;">⚔️ Ноги</button>
        <button class="loc-btn defend-zone-btn" data-zone="legs" style="padding: 6px 2px; font-size: 11px; flex: 1; margin: 0;">🛡️ Ноги</button>
      </div>

      <!-- ПУЛЬТ ДЕЙСТВИЙ С ТАЙМЕРОМ -->
      <div id="battle-controls-zone" style="display: flex; flex-direction: column; gap: 4px; margin-top: 8px;">
        <button id="battle-random-strike-btn" style="width: 100%; background: #222f3e; border: 1px solid #576574; color: #f1c40f; padding: 6px; font-weight: bold; border-radius: 8px; cursor: pointer; font-size: 10px; margin: 0;">🎲 СЛУЧАЙНЫЙ УДАР</button>
        <button id="battle-strike-btn" style="width: 100%; background: #e74c3c; border: none; color: #fff; padding: 8px; font-weight: bold; border-radius: 8px; cursor: pointer; font-size: 11px; margin: 0; letter-spacing: 0.5px;">
          💥 АТАКОВАТЬ (<span id="battle-timer-seconds">30</span>)
        </button>
      </div>

      <button id="battle-action-btn" class="battle-btn-finish" style="display: none; margin-top: 8px; padding: 8px; font-size: 11px;">Завершить бой</button>
    </div>

    <!-- ПРАВАЯ СТОРОНА: ПРОТИВНИК -->
    <div id="bf-monster-avatar-click" style="flex: 1; background: #000; border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; position: relative; cursor: pointer; min-height: 180px; overflow: hidden; padding: 0;">
      
      <!-- Абсолютно яркий эмодзи-значок монстра без прозрачности (opacity: 1) -->
      <div id="bf-monster-icon" style="position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); font-size: 80px; opacity: 1; z-index: 1; pointer-events: none; user-select: none; filter: drop-shadow(0 4px 12px rgba(0,0,0,0.6));">🐺</div>
      
      <!-- Контент поверх фона: Черная информационная плашка в самом низу карточки (z-index: 2) -->
      <div style="width: 100%; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(2px); border-top: 1px solid rgba(255, 255, 255, 0.15); padding: 6px 8px; z-index: 2; display: flex; flex-direction: column; gap: 4px;">
        <div id="bf-monster-name" class="battle-char-name" style="font-size: 13px; font-weight: bold; text-align: center; color: #fff; text-shadow: 0 1px 2px #000;">Монстр</div>
        <div class="hp-bar-bg" style="margin: 0; background: rgba(255,255,255,0.2);"><div id="bf-monster-hp-fill" class="hp-bar-fill" style="background-color: #e74c3c;"></div></div>
        <div id="bf-monster-hp-text" class="battle-char-hp-text" style="font-size: 11px; text-align: center; color: #fff; font-weight: bold; margin: 0; text-shadow: 0 1px 2px #000;">0/0</div>
      </div>
    </div>

  </div>

  <!-- 📜 ЛЕНТА ЛОГОВ БОЯ -->
  <div style="font-size: 11px; color: var(--hint); font-weight: bold; margin-bottom: 4px;">История поединка:</div>
  <div id="battle-log" class="battle-log-viewport" style="flex: 1; min-height: 120px; max-height: 160px; margin: 0;"></div>

  <!-- 📜 ОКНО ПАРАМЕТРОВ ИГРОКА -->
  <div id="player-stats-popover" style="display: none; position: absolute; top: 15%; left: 15%; right: 15%; width: 70%; background: #111; border: 2px solid #2ecc71; border-radius: 14px; padding: 12px; box-shadow: 0 4px 25px rgba(0,0,0,0.9); z-index: 2500; flex-direction: column;">
    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 4px; margin-bottom: 8px;">
      <span id="player-popover-title" style="font-weight: bold; color: #2ecc71; font-size: 13px;">Параметры</span>
      <button id="player-popover-close-btn" class="close-btn" style="width: 22px; height: 26px; font-size: 11px;">✕</button>
    </div>
    <div id="player-popover-body" style="display: flex; flex-direction: column; gap: 4px; font-size: 12px;"></div>
  </div>

  <!-- 📜 ОКНО ПАРАМЕТРОВ МОНСТРА -->
  <div id="monster-stats-popover" style="display: none; position: absolute; top: 15%; left: 15%; right: 15%; width: 70%; background: #111; border: 2px solid #e74c3c; border-radius: 14px; padding: 12px; box-shadow: 0 4px 25px rgba(0,0,0,0.9); z-index: 2500; flex-direction: column;">
    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 4px; margin-bottom: 8px;">
      <span id="monster-popover-title" style="font-weight: bold; color: #e74c3c; font-size: 13px;">Параметры</span>
      <button id="monster-popover-close-btn" class="close-btn" style="width: 22px; height: 26px; font-size: 11px;">✕</button>
    </div>
    <div id="monster-popover-body" style="display: flex; flex-direction: column; gap: 4px; font-size: 12px;"></div>
  </div>

</div>
